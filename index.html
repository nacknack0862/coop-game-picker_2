<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<title>Co-op Game Picker</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:'Inter',sans-serif;
  background:linear-gradient(180deg,#0f0f14,#1a1b22);
  color:white;
}

.container{
  max-width:900px;
  margin:auto;
  padding:40px 20px;
}

h1{
  font-weight:800;
  font-size:42px;
  margin-bottom:30px;
}

.card{
  background:#1f212b;
  border-radius:16px;
  padding:24px;
  margin-bottom:20px;
  box-shadow:0 10px 30px rgba(0,0,0,0.4);
}

label{
  font-weight:600;
}

input{
  padding:10px;
  border-radius:8px;
  border:none;
  width:80px;
  font-size:16px;
  margin-left:10px;
}

button{
  margin-top:20px;
  padding:14px 20px;
  font-size:18px;
  font-weight:600;
  border:none;
  border-radius:12px;
  cursor:pointer;
  background:linear-gradient(45deg,#ff4d6d,#ffb703);
  color:black;
  transition:0.2s;
}

button:hover{
  transform:scale(1.05);
}

.result{
  margin-top:25px;
  padding:20px;
  border-radius:14px;
  background:#272935;
  display:none;
  animation:fade 0.3s ease;
}

@keyframes fade{
  from{opacity:0; transform:translateY(10px)}
  to{opacity:1; transform:translateY(0)}
}

.game-name{
  font-size:28px;
  font-weight:800;
  margin-bottom:10px;
}

.meta{
  opacity:0.8;
}
</style>
</head>

<body>
<div class="container">
  <h1>🎮 Co-op Game Picker</h1>

  <div class="card">
    <label>Minimum Players:
      <input type="number" id="players" value="2" min="2"/>
    </label>
    <br/>
    <button onclick="spin()">🎡 Spin Random Game</button>
  </div>

  <div id="result" class="result"></div>
</div>

<script>
const games = [
  { name:"Overcooked 2", players:4, price:450, genre:"Party Chaos" },
  { name:"It Takes Two", players:2, price:990, genre:"Adventure Co-op" },
  { name:"Phasmophobia", players:4, price:279, genre:"Horror Co-op" },
  { name:"Left 4 Dead 2", players:4, price:199, genre:"Zombie Shooter" },
  { name:"Terraria", players:8, price:199, genre:"Sandbox Survival" },
  { name:"Stardew Valley", players:4, price:315, genre:"Chill Farming" }
];

function spin(){
  const min = parseInt(document.getElementById('players').value);
  const filtered = games.filter(g => g.players >= min);
  const pick = filtered[Math.floor(Math.random()*filtered.length)];

  const box = document.getElementById('result');
  box.style.display='block';
  box.innerHTML = `
    <div class="game-name">🎯 ${pick.name}</div>
    <div class="meta">Players: ${pick.players}</div>
    <div class="meta">Genre: ${pick.genre}</div>
    <div class="meta">Price: ${pick.price}฿</div>
  `;
}
</script>
</body>
</html>
