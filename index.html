<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<title>Co-op Game Wheel</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:'Inter',sans-serif;
  background:radial-gradient(circle at top,#0d0f1a,#05060a);
  color:white;
  text-align:center;
  overflow:hidden;
}

h1{
  margin-top:20px;
  font-size:44px;
  background:linear-gradient(45deg,#7b61ff,#ff4d6d);
  -webkit-background-clip:text;
  color:transparent;
}

#wrapper{
  position:relative;
  margin:auto;
  width:520px;
  height:520px;
  margin-top:30px;
}

canvas{
  border-radius:50%;
  box-shadow:0 0 40px rgba(255,77,109,.5);
}

.pointer{
  position:absolute;
  top:-10px;
  left:50%;
  transform:translateX(-50%);
  width:0;
  height:0;
  border-left:18px solid transparent;
  border-right:18px solid transparent;
  border-bottom:40px solid #ff4d6d;
  filter:drop-shadow(0 0 10px #ff4d6d);
}

button{
  margin-top:30px;
  padding:16px 28px;
  font-size:20px;
  font-weight:700;
  border:none;
  border-radius:14px;
  cursor:pointer;
  background:linear-gradient(45deg,#ff4d6d,#ffb703);
  color:black;
}

.result{
  margin-top:25px;
  font-size:26px;
  font-weight:800;
}
</style>
</head>

<body>

<h1>🎮 Co-op Game Picker</h1>

<div id="wrapper">
  <div class="pointer"></div>
  <canvas id="wheel" width="520" height="520"></canvas>
</div>

<button onclick="spin()">🎡 SPIN THE WHEEL</button>
<div id="result" class="result"></div>

<script>
const games = [
  "Overcooked 2",
  "It Takes Two",
  "Phasmophobia",
  "Left 4 Dead 2",
  "Terraria",
  "Stardew Valley",
  "Deep Rock Galactic",
  "Raft"
];

const canvas = document.getElementById("wheel");
const ctx = canvas.getContext("2d");
const radius = canvas.width/2;
let rotation = 0;

function drawWheel(){
  const slice = (2*Math.PI)/games.length;

  for(let i=0;i<games.length;i++){
    const angle = i*slice;
    ctx.beginPath();
    ctx.moveTo(radius,radius);
    ctx.arc(radius,radius,radius,angle,angle+slice);
    ctx.fillStyle = i%2? "#ffb703" : "#7b61ff";
    ctx.fill();

    ctx.save();
    ctx.translate(radius,radius);
    ctx.rotate(angle+slice/2);
    ctx.fillStyle="black";
    ctx.font="bold 18px Inter";
    ctx.fillText(games[i], 60, 6);
    ctx.restore();
  }
}

function spin(){
  const slice = 360/games.length;
  const index = Math.floor(Math.random()*games.length);
  const degrees = 360*6 + (360 - index*slice);

  canvas.style.transition="transform 5s cubic-bezier(.17,.67,.83,.67)";
  canvas.style.transform=`rotate(${degrees}deg)`;

  setTimeout(()=>{
    document.getElementById("result").innerText = "🎯 " + games[index];
  },5000);
}

drawWheel();
</script>

</body>
</html>
