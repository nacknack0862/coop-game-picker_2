<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<title>Co-op Game Wheel</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0b0f1a;color:#fff;font-family:Inter;text-align:center}
canvas{border-radius:50%;box-shadow:0 0 60px #7b61ff;margin-top:20px}
button{margin:20px;padding:14px 26px;border-radius:10px;border:none;font-weight:800;cursor:pointer}
.result{max-width:900px;margin:20px auto;text-align:left;display:flex;gap:20px;background:#141a28;padding:20px;border-radius:16px}
.result img{width:260px;border-radius:12px}
</style>
</head>
<body>

<h1>🎮 Infinite Co-op Game Wheel</h1>
<canvas id="wheel" width="600" height="600"></canvas>
<br/>
<button onclick="spin()">SPIN</button>
<div id="result"></div>

<script>
let games=[];
let rotation=0;

async function loadGames(){
  const res=await fetch("https://www.cheapshark.com/api/1.0/deals?storeID=1&upperPrice=1000&pageSize=40");
  const data=await res.json();

  games=data.map(g=>({
    name:g.title,
    img:g.thumb,
    price:g.salePrice,
    deal:g.dealID
  }));

  drawWheel();
}

const canvas=document.getElementById("wheel");
const ctx=canvas.getContext("2d");
const R=300;

function drawWheel(){
  const slice=(2*Math.PI)/games.length;
  ctx.clearRect(0,0,600,600);

  games.forEach((g,i)=>{
    const start=i*slice+rotation;
    const end=start+slice;

    ctx.beginPath();
    ctx.moveTo(R,R);
    ctx.arc(R,R,R,start,end);
    ctx.fillStyle=i%2?"#ffb703":"#7b61ff";
    ctx.fill();

    const img=new Image();
    img.src=g.img;
    img.onload=()=>{
      ctx.save();
      ctx.beginPath();
      ctx.moveTo(R,R);
      ctx.arc(R,R,R,start,end);
      ctx.clip();

      ctx.translate(R,R);
      ctx.rotate(start+slice/2);
      ctx.drawImage(img,80,-60,220,120);
      ctx.restore();
    };
  });
}

function ease(t){return 1-Math.pow(1-t,4)}

function spin(){
  const slice=(2*Math.PI)/games.length;
  const index=Math.floor(Math.random()*games.length);
  const target=6*Math.PI*2 - index*slice;

  const start=rotation;
  const startTime=performance.now();
  const duration=4500;

  function anim(now){
    const t=Math.min((now-startTime)/duration,1);
    rotation=start+(target-start)*ease(t);
    drawWheel();
    if(t<1) requestAnimationFrame(anim);
    else showResult(games[index]);
  }
  requestAnimationFrame(anim);
}

function showResult(g){
  document.getElementById("result").innerHTML=`
    <div class="result">
      <img src="${g.img}">
      <div>
        <h2>${g.name}</h2>
        <p>Price: $${g.price}</p>
        <p>Deal ID: ${g.deal}</p>
      </div>
    </div>
  `;
}

loadGames();
</script>

</body>
</html>
