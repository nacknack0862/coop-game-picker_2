<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Co-op Game Picker</title>
  <style>
    body { font-family: sans-serif; background:#111; color:white; padding:20px }
    button { padding:10px 15px; margin-top:10px; font-size:16px }
    .card { margin-top:20px; padding:15px; background:#222; border-radius:10px }
  </style>
</head>
<body>

<h1>🎮 Co-op Game Picker</h1>

<label>Minimum Players:</label>
<input type="number" id="players" value="2" min="2"/>

<br/>
<button onclick="spin()">🎡 Spin Random Game</button>

<div id="result" class="card" style="display:none;"></div>

<script>
const games = [
  { name:"Overcooked 2", players:4, price:450 },
  { name:"It Takes Two", players:2, price:990 },
  { name:"Phasmophobia", players:4, price:279 },
  { name:"Left 4 Dead 2", players:4, price:199 },
  { name:"Terraria", players:8, price:199 },
  { name:"Stardew Valley", players:4, price:315 }
];

function spin(){
  const min = parseInt(document.getElementById('players').value);
  const filtered = games.filter(g => g.players >= min);
  const pick = filtered[Math.floor(Math.random()*filtered.length)];

  const box = document.getElementById('result');
  box.style.display='block';
  box.innerHTML = `
    <h2>🎯 Selected Game</h2>
    <b>${pick.name}</b><br/>
    Players: ${pick.players}<br/>
    Price: ${pick.price}฿
  `;
}
</script>

</body>
</html>
